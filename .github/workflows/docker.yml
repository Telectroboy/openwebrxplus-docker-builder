name: Build & Push (version = luarvique)

on:
  workflow_dispatch:
  schedule:
    # Chaque lundi à 03:17 UTC
    - cron: "17 3 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream version (latest git tag, fallback to version.py)
        id: ver
        shell: bash
        run: |
          set -euo pipefail

          # Prefer latest git tag (most reliable)
          VER="$(git ls-remote --tags --sort='v:refname' https://github.com/luarvique/openwebrx.git \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | sed 's/\^{}//' \
            | tail -n1 || true)"

          # Fallback: parse version.py on master (in case tags are missing/unusable)
          if [ -z "${VER}" ]; then
            VER="$(curl -fsSL https://raw.githubusercontent.com/luarvique/openwebrx/master/owrx/version.py \
              | sed -n 's/.*_versionstring *= *"\(.*\)".*/\1/p' | head -n1 || true)"
          fi

          if [ -z "${VER}" ]; then
            echo "Could not extract version"; exit 1
          fi

          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VER}"

      - name: Check if tag already exists on Docker Hub (skip if yes)
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.ver }}"
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          IMAGE="openwebrxplus"

          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${USER}/${IMAGE}/tags/${VER}/" || true)

          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${USER}/${IMAGE}:${VER} already exists -> skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${USER}/${IMAGE}:${VER} does not exist -> will build."
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.exists.outputs.exists == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists == 'false'

      - uses: docker/login-action@v3
        if: steps.exists.outputs.exists == 'false'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push openwebrxplus
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./buildfiles
          file: ./buildfiles/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            OWRXVERSION=${{ steps.ver.outputs.ver }}
            BUILD_DATE=${{ github.run_id }}
            PRODUCT=openwebrxplus
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openwebrxplus:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openwebrxplus:${{ steps.ver.outputs.ver }}

      - name: Build & push openwebrxplus-softmbe
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./buildfiles
          file: ./buildfiles/Dockerfile-softmbe
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            OWRXVERSION=${{ steps.ver.outputs.ver }}
            BUILD_DATE=${{ github.run_id }}
            PRODUCT=openwebrxplus-softmbe
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openwebrxplus-softmbe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openwebrxplus-softmbe:${{ steps.ver.outputs.ver }}
